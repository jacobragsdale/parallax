# The grid experiment: the demo app served next to generated datasets.
#   cargo run --release -p parallax-server -- --config examples/experiment.toml
# The row counts fit a memory-constrained build host; grid drawing cost depends on
# the visible window, not on the table size.

listen = "127.0.0.1:8791"
static_dir = "web/dist/demo/browser"
# Lets the demo's performance overlay measure the whole tab, worker included.
cross_origin_isolated = true

[[dataset]]
name = "positions"
primary_key = "position_id"
[dataset.source]
kind = "generator"
dataset = "positions"
rows = 200000

[[dataset]]
name = "trades"
primary_key = "trade_id"
[dataset.source]
kind = "generator"
dataset = "trades"
rows = 1000000

# The same generated positions, copied into the browser: views run in the page's
# WebAssembly worker and must show exactly what the server's views show.
[[dataset]]
name = "positions_browser"
primary_key = "position_id"
browser = true
[dataset.source]
kind = "generator"
dataset = "positions"
rows = 200000

# Daily prices for 50 tickers, small enough to hold in the browser.
[[dataset]]
name = "prices"
browser = true
[dataset.source]
kind = "generator"
dataset = "prices"
tickers = 50

[package]
name = "parallax-export"
description = "Excel and CSV exports of parallax views, through the same engine and formatter as the screen"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
arrow-array.workspace = true
arrow-schema.workspace = true
jiff.workspace = true
parallax-engine.workspace = true
parallax-protocol.workspace = true
rust_xlsxwriter = { version = "0.102", default-features = false, features = ["ryu"] }
thiserror.workspace = true

# Large sheets stream through temporary files natively. The browser has no file
# system, so in WebAssembly every sheet is held in memory, and the workbook's
# timestamps come from JavaScript's clock.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rust_xlsxwriter = { version = "0.102", default-features = false, features = ["constant_memory", "ryu"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
rust_xlsxwriter = { version = "0.102", default-features = false, features = ["ryu", "wasm"] }

[dev-dependencies]
calamine = "0.38"
# Path only, so that publishing drops it: the generator depends on the engine.
parallax-datagen = { path = "../parallax-datagen" }
tempfile = "3.27"
zip = { version = "9.2", default-features = false, features = ["deflate"] }

[lints]
workspace = true

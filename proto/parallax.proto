// The parallax wire protocol.
//
// One binary WebSocket per browser tab carries every view, tagged by view id. The
// browser worker that hosts the WebAssembly engine speaks the same messages over
// postMessage. Control messages are protobuf; rows travel as Arrow IPC streams
// inside Frame messages. A view's configuration is the layout JSON document, which
// is versioned and generated from the Rust types.

syntax = "proto3";

package parallax.v1;

// Sent by the client.
message ClientMessage {
  // Echoed in replies, so a client can match responses to requests.
  uint64 request_id = 1;
  oneof body {
    Hello hello = 2;
    OpenView open_view = 3;
    UpdateView update_view = 4;
    SetViewport set_viewport = 5;
    SetExpanded set_expanded = 6;
    CloseView close_view = 7;
    DrillThrough drill_through = 8;
    DistinctValues distinct_values = 9;
    FetchWindow fetch_window = 10;
    SetChartWindow set_chart_window = 11;
  }
}

// Sent by the server or worker.
message ServerMessage {
  // The request this replies to, or 0 for frames pushed after a table refresh.
  uint64 request_id = 1;
  oneof body {
    Welcome welcome = 2;
    ViewOpened view_opened = 3;
    Frame frame = 4;
    Error error = 5;
    TableStatus table_status = 6;
    DistinctValuesResult distinct_values = 7;
    ChartFrame chart_frame = 8;
  }
}

message Hello {
  // The protocol version the client speaks.
  uint32 protocol_version = 1;
}

message Welcome {
  uint32 protocol_version = 1;
  // Datasets the client may open, with their parameter names.
  repeated DatasetInfo datasets = 2;
}

message DatasetInfo {
  string name = 1;
  repeated string parameters = 2;
  // The client may copy the dataset into the browser and run its views there,
  // fetching the copy from the server's /copy/{name} endpoint.
  bool browser = 3;
}

message OpenView {
  // Chosen by the client, unique within the connection.
  uint32 view_id = 1;
  string dataset = 2;
  map<string, string> parameters = 3;
  // The layout JSON for the view.
  string layout_json = 4;
}

message ViewOpened {
  uint32 view_id = 1;
  // The table's schema as an Arrow IPC stream with no batches.
  bytes table_schema = 2;
  TableStatus status = 3;
  // The layout the view runs, which for a drill-through is new to the client.
  string layout_json = 4;
}

message UpdateView {
  uint32 view_id = 1;
  string layout_json = 2;
  // Increases with every update; frames carry it back.
  uint64 config_version = 3;
}

message SetViewport {
  uint32 view_id = 1;
  uint64 first_row = 2;
  uint64 row_count = 3;
  uint32 first_column = 4;
  uint32 column_count = 5;
}

message SetExpanded {
  uint32 view_id = 1;
  // The group's values from the outermost level, as a JSON array.
  string path_json = 2;
  bool expanded = 3;
}

// Asks once for a window, such as the cells a user copies, without moving the
// view's viewport. The reply is a Frame with this request's id; frames pushed
// after a refresh still follow the viewport. At most 1,000,000 cells.
message FetchWindow {
  uint32 view_id = 1;
  uint64 first_row = 2;
  uint64 row_count = 3;
  uint32 first_column = 4;
  uint32 column_count = 5;
}

message CloseView {
  uint32 view_id = 1;
}

message DrillThrough {
  uint32 view_id = 1;
  uint64 row = 2;
  // The id for the new flat view of the group's rows.
  uint32 new_view_id = 3;
}

message DistinctValues {
  uint32 view_id = 1;
  string column = 2;
  // Case-insensitive substring to match, or empty for all.
  string search = 3;
  uint32 limit = 4;
}

message DistinctValuesResult {
  uint32 view_id = 1;
  string column = 2;
  // One Arrow IPC stream with three columns: "value", the values in the
  // column's type; "text", their display text; and "count", their row counts.
  bytes values = 3;
  bool truncated = 4;
}

// A window of a view.
message Frame {
  uint32 view_id = 1;
  uint64 config_version = 2;
  uint64 load_version = 3;
  uint64 first_row = 4;
  uint32 first_column = 5;
  uint64 total_rows = 6;
  uint32 total_columns = 7;
  // One Arrow IPC stream holding one record batch.
  bytes batch = 8;
  // When the source data was read, in microseconds since the Unix epoch.
  int64 source_as_of_micros = 9;
  // Whether this frame answers a viewport request or was pushed after a refresh.
  bool pushed = 10;
}

message TableStatus {
  // The view whose table this describes.
  uint32 view_id = 7;
  uint64 load_version = 1;
  uint64 rows = 2;
  int64 loaded_at_micros = 3;
  // Set when the latest refresh failed; the table keeps its previous load.
  string refresh_error = 4;
  int64 refresh_failed_at_micros = 5;
  repeated ColumnCount nans_to_null = 6;
}

message ColumnCount {
  string column = 1;
  uint64 count = 2;
}

message Error {
  uint32 view_id = 1;
  string message = 2;
}

// Asks for a chart's reduction: an x range at a plot size in pixels. Answered
// with a ChartFrame, and again whenever the table refreshes. Only views whose
// layout has a chart the engine reduces accept it; bar charts and heatmaps draw
// their grouped view's frames.
message SetChartWindow {
  uint32 view_id = 1;
  // The x range in axis positions; absent shows the whole data.
  optional double x_from = 2;
  optional double x_to = 3;
  // The y range of a density; absent spans the data.
  optional double y_from = 4;
  optional double y_to = 5;
  uint32 width = 6;
  uint32 height = 7;
}

// A chart reduced to its plot. The batch is an Arrow IPC stream whose columns
// depend on the chart kind; each names its role in its "parallax.role" metadata:
//
// - line and area: series, x, y (NaN at a break), x_text and y_text (null at a
//   break), one row per kept point, series by series;
// - scatter: count, one row per density cell, row by row from the bottom;
// - histogram: series, from, to, count, from_text and to_text, one row per bin;
// - candlestick and OHLC: from, to, open, high, low, close and their texts, and
//   x_text for the bucket's start, one row per bucket.
message ChartFrame {
  uint32 view_id = 1;
  uint64 config_version = 2;
  uint64 load_version = 3;
  int64 source_as_of_micros = 4;
  // True for frames pushed after a table refresh.
  bool pushed = 5;
  // The x range shown, in axis positions.
  double x_from = 6;
  double x_to = 7;
  repeated ChartTick ticks = 8;
  repeated ChartSeries series = 9;
  bytes batch = 10;
  // A density's cells across and up, and the y range they span.
  uint32 columns = 11;
  uint32 rows = 12;
  double y_from = 13;
  double y_to = 14;
  // A candlestick or OHLC chart's bucket: minutes as "<n>m" (1, 5, 15, 30 or
  // 60), "day", "week", "month", "quarter", "year", or years as "<n>y".
  string interval = 15;
}

// A labelled tick on a chart's x axis.
message ChartTick {
  double x = 1;
  string label = 2;
}

// A series of a line, area or histogram chart.
message ChartSeries {
  // The legend label: the plotted column, then the series column's value.
  string label = 1;
  // The plotted column.
  string column = 2;
  // Drawn against the right y axis.
  bool right = 3;
}

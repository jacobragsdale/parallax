# Dependency policy, checked by cargo-deny in CI.
# Only permissive licences are allowed, so parallax can be adopted without a
# copyleft review. Unicode-3.0 (unicode-ident) and BSL-1.0 (ryu) are permissive
# licences that common foundational crates use. CDLA-Permissive-2.0 covers
# Mozilla's certificate authority list as data (webpki-roots), which the HTTP
# connector's TLS stack carries.

[graph]
all-features = true

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[advisories]
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
